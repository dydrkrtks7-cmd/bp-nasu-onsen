<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="-44" cy="174" r="66" fill="#1a1a2e" opacity="0.11"/>
    <circle cx="1201" cy="-3" r="43" fill="#1a1a2e" opacity="0.10"/>
    <circle cx="305" cy="345" r="88" fill="#1a1a2e" opacity="0.17"/>
    <circle cx="1083" cy="627" r="57" fill="#1a1a2e" opacity="0.18"/>
    <circle cx="227" cy="446" r="32" fill="#1a1a2e" opacity="0.11"/>
    <circle cx="1029" cy="78" r="28" fill="#1a1a2e" opacity="0.08"/>
    <rect x="335" y="541" width="55" height="48" rx="8" fill="#0a0a0a" opacity="0.08" transform="rotate(4, -14, 66)"/>
    <rect x="802" y="-45" width="37" height="78" rx="8" fill="#0a0a0a" opacity="0.10" transform="rotate(30, 603, 71)"/>
    <rect x="710" y="261" width="58" height="37" rx="8" fill="#0a0a0a" opacity="0.13" transform="rotate(6, 304, 435)"/>
    <rect x="455" y="114" width="29" height="40" rx="8" fill="#0a0a0a" opacity="0.14" transform="rotate(0, 412, 679)"/>
    <rect x="1255" y="437" width="34" height="57" rx="8" fill="#0a0a0a" opacity="0.05" transform="rotate(4, 328, 248)"/>
    <rect x="275" y="67" width="66" height="87" rx="8" fill="#0a0a0a" opacity="0.13" transform="rotate(44, 186, 382)"/>
    <rect x="1277" y="107" width="94" height="52" rx="8" fill="#0a0a0a" opacity="0.06" transform="rotate(16, 952, 189)"/>
    <rect x="360" y="1" width="55" height="88" rx="8" fill="#0a0a0a" opacity="0.06" transform="rotate(9, 100, 705)"/>
    <polygon points="708,-79 756,17 660,17" fill="#1a1a2e" opacity="0.03"/>
    <polygon points="897,-70 980,96 814,96" fill="#1a1a2e" opacity="0.09"/>
    <polygon points="460,592 510,692 410,692" fill="#1a1a2e" opacity="0.07"/>
    <polygon points="1213,-99 1299,73 1127,73" fill="#1a1a2e" opacity="0.06"/>

  <!-- Wave at bottom -->
  <path d="M0,576 C360,603 840,549 1200,576 L1200,630 L0,630Z" fill="#1a1a2e" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    Nasu onsen 안내
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    Nasu — 정보
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#7c3aed" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    Nasu Nasu onsen 안내 — 정보
  </text>
</svg>